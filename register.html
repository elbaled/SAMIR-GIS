<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>إنشاء حساب - Ahmed AI</title>

    <link
        rel="stylesheet"
        href="register.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


    <!-- =========================
         BACKGROUND
    ========================== -->

    <div class="background-grid"></div>

    <div class="background-glow glow-one"></div>

    <div class="background-glow glow-two"></div>



    <!-- =========================
         REGISTER CARD
    ========================== -->

    <main class="register-container">


        <div class="register-card">


            <!-- LOGO -->

            <div class="logo">

                <div class="logo-icon">
                    AI
                </div>

                <div class="logo-text">

                    <h1>
                        Ahmed AI
                    </h1>

                    <span>
                        مساعدك الذكي
                    </span>

                </div>

            </div>



            <!-- TITLE -->

            <div class="register-title">

                <h2>
                    إنشاء حساب جديد
                </h2>

                <p>
                    أنشئ حسابك وابدأ استخدام Ahmed AI
                </p>

            </div>



            <!-- FORM -->

            <form
                id="registerForm"
                autocomplete="on"
            >


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        الاسم
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="اكتب اسمك"
                            autocomplete="name"
                            required
                            maxlength="50"
                        >

                    </div>

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            📧
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="6 أحرف على الأقل"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="إظهار كلمة المرور"
                        >
                            👁️
                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        تأكيد كلمة المرور
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔐
                        </span>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="أعد كتابة كلمة المرور"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="confirmPasswordToggle"
                            aria-label="إظهار كلمة المرور"
                        >
                            👁️
                        </button>

                    </div>

                </div>



                <!-- MESSAGE -->

                <div
                    id="message"
                    class="message"
                    role="alert"
                ></div>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    id="registerBtn"
                    class="register-btn"
                >

                    <span id="registerBtnText">
                        إنشاء الحساب
                    </span>

                    <span
                        id="registerLoader"
                        class="loader"
                        style="display:none;"
                    ></span>

                </button>


            </form>



            <!-- LOGIN LINK -->

            <div class="login-link">

                <span>
                    لديك حساب بالفعل؟
                </span>

                <a href="login.html">
                    تسجيل الدخول
                </a>

            </div>



            <!-- SECURITY -->

            <div class="security-note">

                🔒 بيانات حسابك يتم التعامل معها
                من خلال Firebase Authentication

            </div>


        </div>



        <!-- FOOTER -->

        <footer>

            Ahmed AI © 2026

        </footer>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="register.js"
    ></script>


</body>

</html>
